spring.application.name=event-driven
server.port=${SERVER_PORT:8080}

# ─────────────────────────────────────────────────────────────────────────────
# DataSource  —  values come from environment variables (set via .env).
# Defaults are provided so the app fails fast with a clear error rather than
# a NullPointerException if a variable is missing.
# ─────────────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:?DB_HOST env var is required}:${DB_PORT:?DB_PORT env var is required}/${DB_NAME:?DB_NAME env var is required}
spring.datasource.username=${DB_USERNAME:?DB_USERNAME env var is required}
spring.datasource.password=${DB_PASSWORD:?DB_PASSWORD env var is required}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.pool-name=EventPlatformPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ─────────────────────────────────────────────────────────────────────────────
# JPA / Hibernate
# validate — Hibernate checks that the schema matches the entities but does
#            NOT create or modify any table.  Flyway owns the schema.
# ─────────────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ─────────────────────────────────────────────────────────────────────────────
# Flyway  —  manages schema migrations under src/main/resources/db/migration
# ─────────────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# ─────────────────────────────────────────────────────────────────────────────
# Actuator  —  expose only the health endpoint over HTTP for local verification.
# Add more endpoints explicitly when needed (e.g., info,metrics).
# ─────────────────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
