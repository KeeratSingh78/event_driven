# ─────────────────────────────────────────────────────────────────────────────
# application-test.properties
# Activated for @SpringBootTest tests via @ActiveProfiles("test").
#
# @ServiceConnection (from spring-boot-testcontainers) registers a
# JdbcConnectionDetails bean that Spring Boot uses to build the DataSource,
# fully overriding any spring.datasource.url / username / password properties.
#
# We still need to satisfy the :? expressions in application.properties so
# Spring does not fail at property-resolution time.  We do this by setting
# the env-var properties to dummy values here, then letting @ServiceConnection
# replace the actual DataSource connection at context-startup time.
# ─────────────────────────────────────────────────────────────────────────────

# Suppress the :? mandatory-env-var checks in application.properties
# These are overridden at the DataSource level by @ServiceConnection anyway.
DB_HOST=${TEST_DB_HOST:localhost}
DB_PORT=${TEST_DB_PORT:5432}
DB_NAME=${TEST_DB_NAME:event_platform_test}
DB_USERNAME=${TEST_DB_USERNAME:event_app}
DB_PASSWORD=${TEST_DB_PASSWORD:keerat78}
DB_POOL_SIZE=10

# Disable automatic background worker loop during standard test execution
# Concurrency tests can enable or invoke worker components deterministically
app.worker.enabled=false
app.worker.concurrency=3
app.worker.polling-interval-ms=100
app.worker.batch-size=5

# Retry & recovery settings for tests
app.retry.enabled=true
app.retry.default-max-attempts=5
app.retry.base-delay=1s
app.retry.max-delay=60s
app.retry.lease-duration=30s
app.retry.recovery-enabled=false
app.retry.recovery-interval=5s


# Flyway: apply all migrations to the Testcontainers PostgreSQL instance
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA: still validate so tests catch schema drift early
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Actuator
management.endpoints.web.exposure.include=health

